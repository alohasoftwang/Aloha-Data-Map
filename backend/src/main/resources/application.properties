spring.application.name=aloha-data-map-backend
server.port=8080

# MySQL（PostgreSQL 就绪前暂用）
spring.datasource.url=jdbc:mysql://localhost:3306/aloha_datamap?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true
